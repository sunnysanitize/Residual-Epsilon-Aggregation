[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdpagg"
version = "0.1.0"
description = "Adaptive state aggregation for discounted MDPs (arXiv:2107.11053)"
requires-python = ">=3.11"
dependencies = [
    # Upper bound is a type-checking constraint, not a runtime one. numpy 2.5
    # requires Python >= 3.12 and its stubs use PEP 695 `type` statements, which
    # mypy cannot parse under the 3.11 semantics this project checks against --
    # so on 3.12+ a clean checkout would install a numpy that breaks `make lint`
    # while the code itself is fine. Pinning below 2.5 keeps the floor of the
    # supported range actually checked. Lift it when the floor moves to 3.12.
    "numpy>=1.26,<2.5",
    "numba>=0.59",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Figures only. Kept out of the core deps so a clean checkout can run `make all`
# without it -- nothing under src/mdpagg imports matplotlib.
plots = [
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `scripts/` holds the experiment harnesses, not helpers: the eps sweep is what
# Gate 3 was decided on. Importable so their argument handling can be tested
# rather than trusted.
pythonpath = ["scripts"]
markers = [
    "slow: builds large instances; deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Deliberately narrow. The jitted kernels take unannotated array arguments and
# read like Fortran on purpose; a rule set that fights that costs more than it
# catches. F alone earns its place -- it is the unused-import and undefined-name
# check, and an undefined name inside an @njit closure surfaces as a compilation
# error pages away from its cause.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
files = ["src/mdpagg"]
python_version = "3.11"

# mdpagg is a namespace package -- no __init__.py, deliberately. Without a
# package root mypy reads src/mdpagg/types.py as the stdlib `types` and stops.
# These three name it, rather than adding an __init__.py to satisfy the tool.
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

# Numba ships no stubs. Every jitted function is untyped as far as mypy is
# concerned, so this is scoped to the import rather than switched on globally.
[[tool.mypy.overrides]]
module = ["numba.*"]
ignore_missing_imports = true
